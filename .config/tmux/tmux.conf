unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set -g base-index 1
set -g pane-base-index 1
set-option -g status-position top
bind-key b set-option -g status

# vim style pane switching
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_status_background "#{@thm_mantle}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_color "#{@thm_surface0}"
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"
set -g @catppuccin_session_color "#{@thm_lavender}"

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

set -g status-left ""
set -g window-status-current-style "nounderscore"
set -g status-right "#{E:@catppuccin_status_session}"

run '~/.config/tmux/plugins/tpm/tpm'
