unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set -g base-index 1
set -g pane-base-index 1
set -g status-position top
setw -g mode-keys vi

bind-key b set-option -g status

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Catppuccin Mocha palette
set -g @thm_fg        "#cdd6f4"
set -g @thm_mauve     "#cba6f7"
set -g @thm_red       "#f38ba8"
set -g @thm_maroon    "#eba0ac"
set -g @thm_green     "#a6e3a1"
set -g @thm_lavender  "#b4befe"
set -g @thm_surface_0 "#313244"
set -g @thm_surface_1 "#45475a"
set -g @thm_surface_2 "#585b70"
set -g @thm_mantle    "#181825"
set -g @thm_crust     "#11111b"

# Status bar
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g status-left ""

# Windows
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W "
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_lavender}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W "
set -g window-status-current-style "nounderscore"

# Session
set -gF status-right "#[fg=#{@thm_lavender},bg=#{@thm_mantle}]#[fg=#{@thm_crust},bg=#{@thm_lavender}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##S #[fg=#{@thm_surface_0},bg=#{@thm_mantle}]"

# other styles
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_mantle}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0}"

set -gF tree-mode-selection-style "fg=#{@thm_crust},bg=#{@thm_lavender},bold"
set -gF tree-mode-border-style "fg=#{@thm_lavender}"
set -gF tree-mode-preview-style "fg=#{@thm_fg},bg=#{@thm_mantle}"

set -gF menu-style "fg=#{@thm_fg},bg=#{@thm_mantle}"
set -gF menu-selected-style "fg=#{@thm_crust},bg=#{@thm_lavender},bold"
set -gF menu-border-style "fg=#{@thm_surface_1}"
set -gF mode-style "fg=#{@thm_fg},bg=#{@thm_surface_0}"

set -gF pane-border-style "fg=#{@thm_lavender}"
set -gF pane-active-border-style "fg=#{@thm_lavender}"
set -gF display-panes-colour "#{@thm_surface_1}"
set -gF display-panes-active-colour "#{@thm_lavender}"
