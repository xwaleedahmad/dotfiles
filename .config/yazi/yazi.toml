[mgr]
ratio = [0, 2, 4]
sort_by = "natural"
sort_dir_first = true
# linemode = "size"
show_symlinks = true

[preview]
wrap = "no"
max_width = 1400
max_height = 1400

[opener]
play = [
	{ run = "celluloid %s", orphan = true, for = "unix" },
]
edit = [
	{ run = "nvim %s", block = true, for = "unix" },
]
