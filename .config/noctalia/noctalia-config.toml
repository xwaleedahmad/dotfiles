[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = true
    border = "primary"
    capsule = true
    capsule_group = []
    capsule_opacity = 0.89999997988343239
    capsule_thickness = 0.64999998919665813
    center = [ "clock" ]
    concave_edge_corners = false
    end = [ "tray", "notifications", "input_volume", "volume", "bluetooth", "network", "battery" ]
    font_family = "Inter"
    layer = "overlay"
    margin_edge = 6
    margin_ends = 200
    margin_opposite_edge = 0
    padding = 6
    reserve_space = false
    show_on_workspace_switch = false
    smart_auto_hide = false
    start = [ "workspaces", "cpu", "ram", "privacy" ]
    thickness = 36
    widget_spacing = 6

        [bar.default.actions]
        middle = "none"

[control_center]
show_session_button = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "8bury/lid-guard:lid-guard-toggle"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

