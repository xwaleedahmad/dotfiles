[nightlight]
force = false
temperature_day = 3500

[osd.kinds]
bluetooth = false
caffeine = false
dnd = false
lock_keys = false
power_profile = false
wifi = false

[plugin_settings."noctalia/screen_recorder"]
audio_codec = "aac"
audio_source = "none"
copy_to_clipboard = true
resolution = "1920x1080"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/notes", "8bury/lid-guard", "alexander/screen-toolkit" ]

[shell]
app_icon_color = "on_surface"
app_icon_colorize = true
avatar_path = "/home/waleed/Pictures/Me/icon.png"
button_borders = false
card_borders = false
clipboard_enabled = false
corner_radius_scale = 1.2000000178813934
font_family = "Inter"
lang = "en"
polkit_agent = true
popup_borders = false
screen_time_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/waleed/Pictures/Screenshots"
    remember_last_region = true
    show_cursor = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
