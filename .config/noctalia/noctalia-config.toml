[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_thickness = 0.69999998807907104
    center = [ "clock" ]
    end = [ "tray", "notifications", "volume", "bluetooth", "network", "caffeine", "battery" ]
    font_family = "Inter"
    margin_edge = 4
    margin_ends = 240
    margin_opposite_edge = 1
    padding = 6
    reserve_space = false
    smart_auto_hide = true
    start = [ "workspaces", "Wayvibes-Toggle", "cpu", "ram", "privacy" ]
    widget_spacing = 4

        [bar.default.actions]
        middle = "none"

[control_center]
show_session_button = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "8bury/lid-guard:lid-guard-toggle"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

[location]
address = "Sargodha, Pakistan"

[lockscreen]
blur_intensity = 0.099999997764825821
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 752.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.90000000000000002
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 944.0
    cy = 889.0
    enabled = false
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
force = true

[osd.kinds]
bluetooth = false
caffeine = false
dnd = false
lock_keys = false
power_profile = false
wifi = false

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
resolution = "1920x1080"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/notes", "8bury/lid-guard", "alexander/screen-toolkit" ]

[shell]
app_icon_color = "on_surface"
app_icon_colorize = true
avatar_path = "/home/waleed/.face"
clipboard_enabled = false
corner_radius_scale = 1.2000000178813934
font_family = "Inter"
lang = "en"
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "/home/waleed/Pictures/Screenshots"

[system.monitor]
cpu_temp_activity_threshold = 70
cpu_temp_critical_threshold = 90
cpu_usage_activity_threshold = 60
ram_pct_activity_threshold = 85
ram_pct_critical_threshold = 95

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Lavender"
custom_palette = "catppuccin-custom"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "wezterm" ]
    community_ids = [
        "antigravity",
        "opencode",
        "zen-browser",
        "discord",
        "obsidian",
        "vscode",
        "fuzzel",
        "obs",
        "papirus-icons",
        "bat",
        "lazygit",
        "yazi"
    ]

[wallpaper]
directory = "/home/waleed/Pictures/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"

    [wallpaper.last]
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"

    [[wallpaper.favorite]]
    community_palette = "Cherry Blossom"
    palette_source = "community"
    path = "/home/waleed/Pictures/Wallpapers/033.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "Catppuccin Mocha Lavender"
    palette_source = "community"
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/031.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "Catppuccin Mocha Lavender"
    palette_source = "community"
    path = "/home/waleed/Pictures/Wallpapers/catppuccin-mocha/029.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "Peche"
    palette_source = "community"
    path = "/home/waleed/Pictures/Wallpapers/034.jpg"
    theme_mode = "dark"

[widget.Wayvibes-Toggle]
glyph = "keyboard"
tooltip = "Toggle Wayvibes"
type = "custom_button"

    [widget.Wayvibes-Toggle.actions]
    left = "exec ~/scripts/toggle-wayvibes.sh"

[widget.active_window]
display = "text_only"
enabled = false
max_length = 200
min_length = 10

[widget.caffeine]
color = "on_surface"

[widget.clock]
anchor = true
format = "{:%I:%M %p - %a %b %-d}"

[widget.control-center]
glyph = "navigation-filled"

[widget.lock_keys]
hide_when_off = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.privacy]
active_color = "on_surface"
hide_inactive = true
icon_spacing = 8

[widget.tray]
hidden = [ "nm-applet", "wayscriber", "motrix", "vocalinux", "vocalinux-gui" ]
pinned = []

[widget.volume]
mute_color = "on_surface"
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
empty_color = "on_secondary"
hide_when_empty = true
occupied_color = "outline"
show_labels = false
