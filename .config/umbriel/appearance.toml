[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 2
drag_opacity = 0.75
opaque_fullscreen = true


[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1


[appearance.title_bar]
mode = "off"
height = 28
font = "sans 10"
button_position = "right"
buttons = ["minimize", "maximize", "close"]
button_corner_radius = -1
button_glyph = "hover"
button_background = true


[appearance.tab_bar]
style = "indicator"
position = "top"
height = 4
font = "sans 10"
padding = 8
tab_gap = 2
gap = -1
corner_radius = -1
title_format = "{title}"
title_align = "center"
visible = true
hide_when_single = false
max_tabs = 0
overflow = "scroll"


[appearance.shadow]
enabled = false
softness = 10
offset_x = 2
offset_y = 2


[colors]
shadow = "#00000077"
