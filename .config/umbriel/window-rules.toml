# ------------------------------------------------------------------------------
# Password managers / authentication agents
#
# niri: block-out-from "screen-capture". Umbriel's block_capture hides a window
# from screenshots and recordings in the same way.
# ------------------------------------------------------------------------------
[[window_rule]]
match.app_id = "^polkit-gnome-authentication-agent-1$"
block_capture = true

