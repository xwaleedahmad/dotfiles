# ------------------------------------------------------------------------------
# Global
# ------------------------------------------------------------------------------
[[window_rule]]
opacity = 0.95
blur = false
blur_popups = false
default_maximize = false
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size = { width = 0.7, height = 0.7 }

[[window_rule]]
match.is_floating = true
shadow = true

[[window_rule]]
match.is_cast_target = true
border_width = 2
border_color_focused = "#40C057FF"
border_color_unfocused = "#40C057FF"

[[window_rule]]
match.content_type = "game"
tearing = true

# ------------------------------------------------------------------------------
# Applications
# ------------------------------------------------------------------------------
[[window_rule]]
match.app_id = [ "^brave-*", "firefox", "Loupe", "celluloid"]
opacity = 1.0

[[window_rule]]
match.title = "- Helium$"
opacity = 1.0

[[window_rule]]
match.app_id = "^steam$"
match.title = '^notificationtoasts_\d+_desktop$'
default_floating = true
default_maximize = false
default_focused = false
default_pinned = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.app_id = ["^helium$", "^brave-origin$", "^brave-browser$", "^brave$"]
match.title = '^(Picture-in-Picture|Picture in picture)$'
default_floating = true
default_maximize = false

[[window_rule]]
match.app_id = "it.catboy.ripdrag"
match.title = "it.catboy.ripdrag"
default_floating = true
default_floating_size = { width = 0.1, height = 0.1 }

# ------------------------------------------------------------------------------
# Noctalia
# ------------------------------------------------------------------------------
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_maximize = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_maximize = false

# ------------------------------------------------------------------------------
# Scratchpads
# ------------------------------------------------------------------------------
[[window_rule]]
match.app_id = "^scratchpad-terminal$"
default_scratchpad = "terminal"
default_floating = true
default_maximize = false
default_focused = true
default_floating_size = { width = 0.7, height = 0.7 }

[[window_rule]]
match.app_id = "obsidian"
default_scratchpad = "notes"
default_floating = true
default_maximize = false
default_focused = true
default_floating_size = { width = 0.9, height = 0.9 }

[[window_rule]]
match.app_id = "chrome-cinhimbnkkaeohfgghhklpknlkffjgod-Default"
default_scratchpad = "music"
default_floating = true
default_maximize = false
default_focused = true
opacity = 0.90
default_floating_size = { width = 0.9, height = 0.9 }

[[window_rule]]
match.app_id = "chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default"
default_scratchpad = "whatsapp"
default_floating = true
default_maximize = false
default_focused = true
opacity = 0.90
default_floating_size = { width = 0.9, height = 0.9 }

[[window_rule]]
match.app_id = "chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Default"
default_scratchpad = "gmail"
default_floating = true
default_maximize = false
default_focused = true
opacity = 0.90
default_floating_size = { width = 0.9, height = 0.9 }

# ------------------------------------------------------------------------------
# Password managers / authentication agents
# ------------------------------------------------------------------------------
[[window_rule]]
match.app_id = "^polkit-gnome-authentication-agent-1$"
block_capture = true
